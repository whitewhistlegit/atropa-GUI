name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # Deliberately NOT installing the atropa package/PyGObject itself:
        # backend/ has zero GTK dependencies by design (see DOCUMENTATION.md
        # section 1), and pulling in PyGObject would need system GTK4/libadwaita
        # dev packages just to lint and test pure-Python subprocess wrappers.
        run: pip install pytest ruff

      - name: Compile check (every file, catches syntax errors immediately)
        run: python3 -m py_compile atropa/*.py atropa/ui/*.py atropa/ui/pages/*.py atropa/backend/*.py tests/*.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Run backend test suite
        run: python3 -m pytest -v

  gtk-smoke:
    # The backend suite deliberately never imports GTK. This job is the only
    # CI coverage of the 29 page constructors: build every page under Xvfb,
    # with backend calls disabled by ATROPA_UI_SMOKE. The distro PyGObject is
    # used because setup-python interpreters don't ship the Gtk/Adw typelibs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4, libadwaita, PyGObject and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-pytest xvfb gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Construct every page under Xvfb
        run: xvfb-run -a python3 -m pytest tests/test_ui_smoke.py -q
